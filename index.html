<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curtio — URL shortener with real click tracking</title>
    <meta
      name="description"
      content="Curtio turns long URLs into clean short links and counts every click the right way. See real visitors, not bots and link previews padding your numbers."
    />
    <link rel="canonical" href="https://curtio.io/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (baseline; per-route values are set at runtime by src/components/Seo.jsx) -->
    <meta property="og:site_name" content="Curtio" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Curtio — URL shortener with real click tracking" />
    <meta
      property="og:description"
      content="Curtio turns long URLs into clean short links and counts every click the right way. See real visitors, not bots and link previews padding your numbers."
    />
    <meta property="og:url" content="https://curtio.io/" />
    <meta property="og:image" content="https://curtio.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Curtio link analytics dashboard showing clicks over time" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@curtio" />
    <meta name="twitter:title" content="Curtio — URL shortener with real click tracking" />
    <meta
      name="twitter:description"
      content="Curtio turns long URLs into clean short links and counts every click the right way. See real visitors, not bots and link previews padding your numbers."
    />
    <meta name="twitter:image" content="https://curtio.io/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
